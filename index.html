<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Task Tide</title>
<style>
  :root {
    --jar-glass: rgba(255,255,255,0.35);
    --jar-rim: #c9d6e3;
    --water-top: #7fd8e0;
    --water-bottom: #2f8fb0;
    --bg-top: #eaf6f9;
    --bg-bottom: #cfe9ee;
    --ink: #234;
    --pop: #ffd166;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    padding: 24px 16px 60px;
  }

  h1 {
    font-size: 1.6rem;
    margin: 8px 0 2px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    font-size: 0.85rem;
    opacity: 0.65;
    margin-bottom: 20px;
    text-align: center;
  }

  .add-row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 380px;
    margin-bottom: 20px;
  }

  .add-row input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #b7cdd9;
    font-size: 0.95rem;
    outline: none;
    background: white;
  }

  .add-row input:focus {
    border-color: #4fb8c9;
    box-shadow: 0 0 0 3px rgba(79,184,201,0.2);
  }

  .add-row button {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    background: #3aa7bb;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }

  .add-row button:hover { background: #2f8fa0; }
  .add-row button:active { transform: scale(0.94); }

  /* --- JAR --- */
  .jar-wrap {
    position: relative;
    width: 260px;
    height: 340px;
  }

  .jar {
    position: absolute;
    inset: 0;
    border: 6px solid var(--jar-rim);
    border-top: none;
    border-radius: 0 0 40px 40px;
    background: var(--jar-glass);
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(255,255,255,0.4), 0 8px 20px rgba(0,0,0,0.08);
  }

  .jar-neck {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 24px;
    border: 6px solid var(--jar-rim);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    background: var(--jar-glass);
  }

  .water {
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: 0;
    height: 0%;
    background: linear-gradient(180deg, var(--water-top), var(--water-bottom));
    transition: height 0.6s cubic-bezier(.34,1.56,.64,1);
    border-radius: 50% 50% 0 0 / 18px 18px 0 0;
  }

  .water::before {
    content: "";
    position: absolute;
    top: -12px;
    left: 0;
    right: 0;
    height: 24px;
    background: inherit;
    border-radius: 50%;
    animation: wave 3.2s ease-in-out infinite;
    opacity: 0.9;
  }

  @keyframes wave {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-3px) scaleX(1.03); }
  }

  .tasks-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    padding: 10px 14px;
    gap: 8px;
    overflow: hidden;
  }

  .task-bubble {
    max-width: 90%;
    padding: 8px 14px;
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    font-size: 0.82rem;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    cursor: pointer;
    user-select: none;
    animation: bob 3.5s ease-in-out infinite, dropIn 0.5s cubic-bezier(.34,1.56,.64,1);
    word-break: break-word;
    transition: transform 0.15s;
  }

  .task-bubble:hover { transform: scale(1.04); }

  .task-bubble.popping {
    animation: pop 0.45s forwards;
    pointer-events: none;
  }

  @keyframes dropIn {
    from { transform: translateY(-160px) scale(0.6); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  @keyframes bob {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -6px; }
  }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.8; background: var(--pop); }
    100% { transform: scale(0); opacity: 0; }
  }

  .empty-msg {
    margin: auto;
    font-size: 0.85rem;
    opacity: 0.5;
    text-align: center;
    padding: 0 30px;
  }

  .stats {
    margin-top: 16px;
    font-size: 0.85rem;
    opacity: 0.7;
    text-align: center;
  }

  .clear-btn {
    margin-top: 10px;
    background: none;
    border: none;
    color: #6a8393;
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
  }

  .confetti {
    position: fixed;
    pointer-events: none;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    z-index: 10;
  }
</style>
</head>
<body>

  <h1>🫙 Tiny Task Tide</h1>
  <div class="subtitle">Add tasks and watch the tide rise. Tap one to pop it.</div>

  <div class="add-row">
    <input id="taskInput" type="text" placeholder="What needs doing?" maxlength="60" autofocus />
    <button id="addBtn">Add</button>
  </div>

  <div class="jar-wrap">
    <div class="jar-neck"></div>
    <div class="jar">
      <div class="water" id="water"></div>
      <div class="tasks-layer" id="tasksLayer">
        <div class="empty-msg" id="emptyMsg">The jar is calm and empty.<br>Add your first task above 🌊</div>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <button class="clear-btn" id="clearBtn">clear completed history</button>

  <script>
    const STORAGE_KEY = 'tinyTaskTide.tasks';
    const input = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const tasksLayer = document.getElementById('tasksLayer');
    const water = document.getElementById('water');
    const emptyMsg = document.getElementById('emptyMsg');
    const stats = document.getElementById('stats');
    const clearBtn = document.getElementById('clearBtn');

    let tasks = load();
    let completedCount = load('tinyTaskTide.completedCount', 0);

    function load(key = STORAGE_KEY, fallback = []) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        localStorage.setItem('tinyTaskTide.completedCount', JSON.stringify(completedCount));
      } catch (e) { /* storage unavailable, ignore */ }
    }

    function render() {
      tasksLayer.querySelectorAll('.task-bubble').forEach(el => el.remove());
      emptyMsg.style.display = tasks.length === 0 ? 'block' : 'none';

      tasks.forEach(task => {
        const bubble = document.createElement('div');
        bubble.className = 'task-bubble';
        bubble.textContent = task.text;
        bubble.dataset.id = task.id;
        bubble.style.animationDelay = `${Math.random() * 1.5}s`;
        bubble.addEventListener('click', () => completeTask(task.id, bubble));
        tasksLayer.appendChild(bubble);
      });

      const level = Math.min(85, tasks.length * 14 + (tasks.length ? 10 : 0));
      water.style.height = level + '%';

      stats.textContent = tasks.length
        ? `${tasks.length} task${tasks.length === 1 ? '' : 's'} afloat • ${completedCount} popped so far`
        : (completedCount ? `Jar's empty — ${completedCount} popped so far. Nice.` : '');
    }

    function addTask(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      tasks.push({ id: Date.now() + Math.random(), text: trimmed });
      save();
      render();
    }

    function completeTask(id, bubbleEl) {
      bubbleEl.classList.add('popping');
      setTimeout(() => {
        tasks = tasks.filter(t => t.id !== id);
        completedCount += 1;
        save();
        render();
      }, 420);
    }

    addBtn.addEventListener('click', () => {
      addTask(input.value);
      input.value = '';
      input.focus();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        addTask(input.value);
        input.value = '';
      }
    });

    clearBtn.addEventListener('click', () => {
      completedCount = 0;
      save();
      render();
    });

    render();
  </script>
</body>
</html>
